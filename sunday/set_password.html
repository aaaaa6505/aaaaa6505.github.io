<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定密碼 — 追光號</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --nav:    #024a52;
      --deep:   #03666f;
      --mid:    #038b94;
      --bright: #33b5ab;
      --pale:   #c8eeec;
      --navy:   #255194;
      --cta:    #255194;
      --cta-dk: #1a3d70;
      --bg:     #f0fafa;
      --bg2:    #f0f4fb;
      --text:   #0a1a20;
      --muted:  #3a5a60;
      --white:  #ffffff;
      --r:      24px;
      --cream:  #f8f4ee;
      --main:   #3A9CC5;
      --main-dk:#2a7fa0;
      --danger: #dc2626;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── LOGO ── */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1.8rem;
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-text {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: .05em;
      color: var(--deep);
    }
    .logo-sub {
      font-size: .82rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: .04em;
    }

    /* ── CARD ── */
    .card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(3,102,111,.1), 0 1px 4px rgba(0,0,0,.06);
      width: 100%;
      max-width: 480px;
      padding: 2.4rem 2.2rem 2rem;
    }

    /* ── WELCOME ── */
    .welcome-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: .5rem;
      letter-spacing: -.01em;
    }
    .welcome-sub {
      font-size: .88rem;
      color: var(--muted);
      line-height: 1.75;
      margin-bottom: 1.4rem;
    }

    /* ── USER INFO ── */
    .user-info {
      background: var(--bg);
      border-radius: 10px;
      padding: .9rem 1.1rem;
      margin-bottom: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: .35rem;
    }
    .user-info-row {
      font-size: .88rem;
      color: var(--deep);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .user-info-note {
      font-size: .76rem;
      color: rgba(58,90,96,.55);
      margin-top: .3rem;
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 1.1rem;
    }
    .form-label {
      display: block;
      font-size: .82rem;
      font-weight: 700;
      color: var(--deep);
      margin-bottom: .4rem;
    }
    .form-input {
      width: 100%;
      padding: .75rem 1rem;
      border: 1.5px solid var(--pale);
      border-radius: 10px;
      font-size: .95rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: border-color .2s, background .2s;
      outline: none;
    }
    .form-input:focus { border-color: var(--bright); background: var(--white); }
    .form-input.error { border-color: var(--danger); }
    .form-hint {
      font-size: .76rem;
      color: rgba(58,90,96,.55);
      margin-top: .35rem;
      line-height: 1.5;
    }
    .form-error {
      display: none;
      font-size: .76rem;
      color: var(--danger);
      margin-top: .35rem;
      font-weight: 600;
    }
    .form-error.visible { display: block; }

    /* ── SUBMIT BUTTON ── */
    .btn-submit {
      width: 100%;
      padding: .9rem;
      background: var(--main);
      color: var(--white);
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s, transform .15s;
      margin-top: .4rem;
    }
    .btn-submit:hover { background: var(--main-dk); transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }

    /* ── SUCCESS STATE ── */
    .success-state {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: .5rem 0 .8rem;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #d1fae5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.2rem;
      color: #059669;
    }
    .success-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: .4rem;
    }
    .success-sub {
      font-size: .88rem;
      color: var(--muted);
      margin-bottom: 1.4rem;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: var(--pale);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--bright);
      border-radius: 999px;
      transition: width 2s linear;
    }

    /* ── FOOTER NOTE ── */
    .footer-note {
      margin-top: 1.4rem;
      font-size: .76rem;
      color: rgba(58,90,96,.55);
      text-align: center;
      line-height: 1.75;
      max-width: 480px;
    }
    .footer-note a { color: var(--mid); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }

    /* ── EXPIRED CARD ── */
    .expired-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fee2e2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.2rem;
      color: var(--danger);
    }
    .expired-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text);
      text-align: center;
      margin-bottom: .6rem;
    }
    .expired-desc {
      font-size: .88rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }
    .btn-contact {
      display: block;
      text-align: center;
      width: 100%;
      padding: .85rem;
      background: transparent;
      border: 2px solid var(--main);
      color: var(--main);
      border-radius: 999px;
      font-size: .95rem;
      font-weight: 800;
      text-decoration: none;
      font-family: inherit;
      transition: background .2s, color .2s;
    }
    .btn-contact:hover { background: var(--main); color: var(--white); }

    @media (max-width: 520px) {
      .card { padding: 1.8rem 1.2rem 1.5rem; border-radius: 12px; }
      body { padding: 1.5rem .75rem; justify-content: flex-start; padding-top: 2.5rem; }
    }
  </style>
</head>
<body>

<!--
  正常狀態：顯示 #form-card，隱藏 #expired-card
  連結失效：顯示 #expired-card，隱藏 #form-card
  工程師可依後端回傳的 token 狀態控制顯示哪個卡片
-->

<!-- LOGO -->
<div class="logo-area">
  <a class="logo-row" href="wk_v4.html">
    <svg width="40" height="40" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="90" fill="#F2F7F9" stroke="#1A5C7A" stroke-width="4"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#3A9CC5" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle cx="100" cy="100" r="66" fill="none" stroke="#3A9CC5" stroke-width="1"/>
      <line x1="100" y1="18" x2="100" y2="32" stroke="#3A9CC5" stroke-width="2"/>
      <line x1="100" y1="168" x2="100" y2="182" stroke="#3A9CC5" stroke-width="2"/>
      <line x1="18" y1="100" x2="32" y2="100" stroke="#3A9CC5" stroke-width="2"/>
      <line x1="168" y1="100" x2="182" y2="100" stroke="#3A9CC5" stroke-width="2"/>
      <line x1="155" y1="45" x2="146" y2="54" stroke="#3A9CC5" stroke-width="1.5"/>
      <line x1="45" y1="45" x2="54" y2="54" stroke="#3A9CC5" stroke-width="1.5"/>
      <line x1="155" y1="155" x2="146" y2="146" stroke="#3A9CC5" stroke-width="1.5"/>
      <line x1="45" y1="155" x2="54" y2="146" stroke="#3A9CC5" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#E8B84B">N</text>
      <polygon points="100,38 94,100 100,90 106,100" fill="#E8B84B" stroke="#0D3B4F" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="100,162 94,100 100,110 106,100" fill="#1A5C7A" stroke="#0D3B4F" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="100" cy="100" r="10" fill="#E8B84B" stroke="#0D3B4F" stroke-width="2"/>
      <circle cx="100" cy="100" r="4" fill="#0D3B4F"/>
    </svg>
    <span class="logo-text">追光號</span>
  </a>
  <span class="logo-sub">主日學教材平台</span>
</div>

<!-- ══ 正常狀態卡片 ══ -->
<div class="card" id="form-card">

  <!-- 歡迎標題 -->
  <div class="welcome-title">歡迎加入追光號 🎉</div>
  <div class="welcome-sub">
    你的帳號已建立完成。<br>
    請設定你的登入密碼以開始使用。
  </div>

  <!-- 用戶資訊 -->
  <div class="user-info">
    <div class="user-info-row">👤 陳雅琳</div>
    <div class="user-info-row">✉️ teacher1@grace.org.tw</div>
    <div class="user-info-row">🏛 沛恩教會</div>
    <div class="user-info-note">如果這不是你，請忽略此邀請。</div>
  </div>

  <!-- 表單 -->
  <div id="form-area">
    <div class="form-group">
      <label class="form-label" for="password">新密碼</label>
      <input class="form-input" type="password" id="password" placeholder="請輸入密碼" autocomplete="new-password">
      <div class="form-error" id="err-password"></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm-password">確認密碼</label>
      <input class="form-input" type="password" id="confirm-password" placeholder="再次輸入密碼" autocomplete="new-password">
      <div class="form-error" id="err-confirm"></div>
      <div class="form-hint">密碼至少 8 個字元，需包含英文字母與數字</div>
    </div>
    <button class="btn-submit" id="btn-submit" onclick="handleSubmit()">設定密碼並登入</button>
  </div>

  <!-- 成功狀態（隱藏） -->
  <div class="success-state" id="success-state">
    <div class="success-icon">✓</div>
    <div class="success-title">密碼設定成功！</div>
    <div class="success-sub">正在跳轉到課程頁面...</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

</div>

<!-- ══ 連結失效卡片（預設隱藏） ══ -->
<div class="card" id="expired-card" style="display:none;">
  <div class="expired-icon">✕</div>
  <div class="expired-title">此邀請連結已失效</div>
  <div class="expired-desc">
    這個連結可能已超過 72 小時有效期，<br>
    或已經被使用過。
  </div>
  <a href="contact.html" class="btn-contact">聯絡我們重新申請</a>
</div>

<!-- 底部說明 -->
<div class="footer-note">
  此邀請連結僅供單次使用，有效期為 72 小時。<br>
  如有問題請聯絡 <a href="mailto:hello@wewayfinders.com">hello@wewayfinders.com</a>
</div>

<script>
  const PW_REGEX = /^(?=.*[a-zA-Z])(?=.*\d).{8,}$/;

  function setError(inputId, errorId, msg) {
    const input = document.getElementById(inputId);
    const err   = document.getElementById(errorId);
    if (msg) {
      input.classList.add('error');
      err.textContent = msg;
      err.classList.add('visible');
    } else {
      input.classList.remove('error');
      err.classList.remove('visible');
    }
    return !!msg;
  }

  function validatePassword(pw) {
    if (!pw) return '密碼不可空白';
    if (pw.length < 8) return '密碼至少需要 8 個字元';
    if (!/[a-zA-Z]/.test(pw) || !/\d/.test(pw)) return '密碼需包含英文字母與數字';
    return '';
  }

  // 確認密碼欄位 blur 時即時驗證
  document.getElementById('confirm-password').addEventListener('blur', function() {
    const pw  = document.getElementById('password').value;
    const cpw = this.value;
    if (cpw && pw !== cpw) {
      setError('confirm-password', 'err-confirm', '兩次輸入的密碼不相符');
    } else {
      setError('confirm-password', 'err-confirm', '');
    }
  });

  function handleSubmit() {
    const pw  = document.getElementById('password').value;
    const cpw = document.getElementById('confirm-password').value;

    const pwErr  = setError('password',         'err-password', validatePassword(pw));
    const cpwErr = setError('confirm-password', 'err-confirm',
      !cpw ? '請再次輸入密碼' : pw !== cpw ? '兩次輸入的密碼不相符' : '');

    if (pwErr || cpwErr) return;

    // 驗證通過：顯示成功狀態
    document.getElementById('form-area').style.display = 'none';
    const success = document.getElementById('success-state');
    success.style.display = 'flex';

    // 啟動進度條
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.getElementById('progress-fill').style.width = '100%';
      });
    });

    // 2 秒後跳轉
    setTimeout(() => { window.location.href = 'member_area.html'; }, 2000);
  }
</script>

</body>
</html>
